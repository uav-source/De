dataset:
  name: MUN-FRL
  sequence: Lighthouse benchmarking bag
  release_status: READY_MINOR_ADAPTER
  bag_argument: --bag
  bag_environment_variable: MUN_FRL_BAG
  reference_topic: /fix
  reference_role: offline_position_only_evaluation

common:
  lid_topic: /velodyne_points
  imu_topic: /imu/data
  time_sync_en: false
  time_offset_lidar_to_imu: 0.0034

preprocess:
  lidar_type: 2       # FAST-LIO2 Velodyne enum
  scan_line: 16
  blind: 1.0
  scan_rate: 10
  timestamp_unit: 0  # FAST-LIO2 SEC enum; source field is relative seconds

mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 180.0
  det_range: 100.0
  extrinsic_est_en: false
  # p_imu = R_imu_lidar * p_lidar + t_imu_lidar; do not invert.
  extrinsic_T: [-0.0593, 0.0468, -0.1249]
  extrinsic_R: [0.0018, 0.0019, 1.0,
                0.0011, -1.0, 0.0019,
                1.0, 0.0011, -0.0018]

publish:
  path_en: true
  scan_publish_en: false
  dense_publish_en: false
  scan_bodyframe_pub_en: false

pcd_save:
  pcd_save_en: false
  interval: -1

