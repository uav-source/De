immutable_backend_contract:
  required_pcl_version: 1.15.1
  registration_class: pcl::IterativeClosestPointWithNormals
  transformation_estimation: pcl::registration::TransformationEstimationPointToPlaneLLS
  normal_estimation:
    implementation: pcl::NormalEstimationOMP
    method: KSearch
    k: 50
    threads: 1
  icp:
    maximum_correspondence_distance_m: 0.50
    maximum_iterations: 50
    transformation_epsilon: 1.0e-10
    euclidean_fitness_epsilon: 1.0e-10
    use_reciprocal_correspondences: false
    use_symmetric_objective: false
    enforce_same_direction_normals: true
  parameter_difference_from_v2_target: 0
  normal_parameter_difference_from_v2_target: 0

rotation_serialization:
  input_source: highest_precision_numeric_values_from_raw_json
  float_minimum_significant_digits: std::numeric_limits<float>::max_digits10
  double_minimum_significant_digits: std::numeric_limits<double>::max_digits10
  json_strategy: round_trip_numeric_serialization
  icp_result_modification_forbidden: true

nearest_so3_projection:
  decomposition: R_raw = U * Sigma * V_transpose
  reflection_handling:
    D: diag(1, 1, sign(det(U * V_transpose)))
    R_projected: U * D * V_transpose
    require_projected_determinant_positive: true
  truth_rotation:
    finite_required: true
    determinant_positive_required: true
    orthogonality_verified: true
    modification_forbidden: true

rotation_matrix_quality_gate:
  raw_rotation_finite: true
  raw_rotation_determinant_positive: true
  orthogonality_defect_fro_max: 1.0e-5
  abs_raw_determinant_minus_one_max: 1.0e-5
  projection_correction_fro_max: 1.0e-5
  projection_cannot_rescue_quality_failure: true

formal_rotation_error:
  R_error: R_truth_transpose * R_projected
  cos_theta: clip((trace(R_error) - 1) / 2, -1, 1)
  sin_theta: 0.5 * norm([R21-R12, R02-R20, R10-R01])
  rotation_error_rad: atan2(sin_theta, cos_theta)
  raw_trace_acos_rotation_error_rad:
    retained_as_diagnostic_only: true
    formal_gate_use_forbidden: true

cross_implementation_verification:
  implementation_1: C++ Eigen JacobiSVD with reflection-safe projection and atan2
  implementation_2: Python NumPy SVD with reflection-safe projection and atan2
  maximum_absolute_difference_rad: 1.0e-10
  choose_smaller_value_if_mismatch_forbidden: true
  mismatch_stops_v3: true

microtests:
  NONDEGENERATE_IDENTITY:
    fixture_and_initial_transform_changed_from_v2: false
    gates:
      translation_update_norm_m_max: 1.0e-8
      rotation_update_norm_rad_max: 1.0e-8
      rotation_matrix_quality_pass: true
      rotation_metric_crosscheck_pass: true
      has_converged_raw: true
      final_transform_finite: true
      fitness_finite: true
      correspondence_count_min_exclusive: 0
      invalid_normal_count: 0
  KNOWN_SMALL_TRANSFORM:
    fixture_truth_and_initial_transform_changed_from_v2: false
    truth_passed_to_registration_cli: false
    gates:
      translation_error_to_truth_m_max: 1.0e-4
      projected_atan2_rotation_error_to_truth_rad_max: 1.0e-4
      rotation_matrix_quality_pass: true
      rotation_metric_crosscheck_pass: true
      has_converged_raw: true
      final_transform_finite: true
      fitness_finite: true
  PLANAR_DEGENERACY_DIAGNOSTIC:
    fixture_changed_from_v2: false
    point_cloud_rank: 2
    point_to_plane_jacobian_rank_max_exclusive: 6
    rank_deficient: true
    has_converged_raw_required: false

authorization:
  implementation_valid_expression: A_pass and B_pass and C_pass and rotation_matrix_quality_pass and rotation_metric_crosscheck_pass and parameter_fixture_truth_seed_firewalls_pass
  if_expression_true:
    PCL_BACKEND_IMPLEMENTATION_VALID: true
    PCL_BACKEND_PHASE_A_QUALIFICATION_AUTHORIZED: true
  otherwise:
    PCL_BACKEND_IMPLEMENTATION_VALID: false
    PCL_BACKEND_PHASE_A_QUALIFICATION_AUTHORIZED: false
  authorization_scope_if_true: Phase_A_protocol_and_run_only
  phase_a_execution_in_v3: false
  phase_b_execution_in_v3: false
  third_backend_substitution_forbidden: true

protected_components:
  open3d_modification_forbidden: true
  native_modification_forbidden: true
  odi_modification_forbidden: true
  d50_restoration_forbidden: true
  fast_lio2_modification_forbidden: true
  scene_generator_modification_forbidden: true
  git_push_forbidden: true
