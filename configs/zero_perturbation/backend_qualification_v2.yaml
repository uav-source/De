schema_version: zero_perturbation_pcl_backend_qualification_v2

protocol:
  name: pcl_backend_implementation_qualification_v2
  version: "2.0.0"
  status: prospectively_frozen_before_v2_cli_diagnostic_implementation_or_microtest_execution
  scope: pcl_backend_implementation_only
  phase_a_execution_authorized_by_this_protocol: false
  phase_b_execution_authorized_by_this_protocol: false
  development_execution_authorized: false
  confirmatory_execution_authorized: false
  third_backend_substitution_forbidden: true

v1_preserved_result:
  branch: feature/zero-perturbation-backend-qualification
  decision_commit: 04cb2e36c2af75500ae1b5c65bd7c2b037613bfe
  protocol_path: configs/zero_perturbation/backend_qualification_v1.yaml
  report_path: artifacts/current/zero_perturbation_backend_qualification/backend_qualification_report.md
  PCL_DEPENDENCY_READY: true
  PCL_CLI_COMPILED: true
  PCL_V1_PLANAR_IDENTITY_SMOKE: FAIL
  retrospective_pass_rewrite_forbidden: true
  v1_fixture_modification_forbidden: true
  reclassification:
    PCL_V1_SMOKE_FIXTURE_DEGENERATE: true
    PCL_BACKEND_QUALIFICATION: NOT_EVALUATED
    point_cloud_rank: 2
    point_to_plane_jacobian_rank: 3
    point_to_plane_hessian_eigenvalues: [0.0, 0.0, 0.0, 3.36, 3.36, 64.0]
    interpretation: fixture_is_not_a_valid_hard_gate_for_six_dof_backend_qualification

immutable_backend_contract:
  required_pcl_version: 1.15.1
  point_type: pcl::PointNormal
  registration_class: pcl::IterativeClosestPointWithNormals
  transformation_estimation: pcl::registration::TransformationEstimationPointToPlaneLLS
  normal_estimation:
    implementation: pcl::NormalEstimationOMP
    method: KSearch
    k: 50
    threads: 1
  icp:
    maximum_correspondence_distance_m: 0.50
    maximum_iterations: 50
    transformation_epsilon: 1.0e-10
    euclidean_fitness_epsilon: 1.0e-10
    use_reciprocal_correspondences: false
    use_symmetric_objective: false
    enforce_same_direction_normals: true
  parameter_change_forbidden: true
  open3d_modification_forbidden: true
  native_modification_forbidden: true

seed_firewall:
  fixture_generator_random_seed_used: false
  development_seed_access_forbidden: true
  confirmatory_seed_access_forbidden: true
  old_capture_range_test_seed_access_forbidden: true
  target_access_count: 0

