      - 289.94028524243305
      - 328.8629856151476

microtests:
  ordered_tests:
    - NONDEGENERATE_IDENTITY
    - KNOWN_SMALL_TRANSFORM
    - PLANAR_DEGENERACY_DIAGNOSTIC
  NONDEGENERATE_IDENTITY:
    source: tests/data/pcl_backend_v2/nondegenerate_source.pcd
    target: tests/data/pcl_backend_v2/nondegenerate_target.pcd
    initial_transform: identity
    gates:
      has_converged_raw: true
      final_transform_finite: true
      fitness_finite: true
      translation_update_norm_m_max: 1.0e-8
      rotation_update_norm_rad_max: 1.0e-8
      correspondence_count_min_exclusive: 0
      source_normal_nan_count: 0
      source_normal_zero_count: 0
      target_normal_nan_count: 0
      target_normal_zero_count: 0
  KNOWN_SMALL_TRANSFORM:
    target: tests/data/pcl_backend_v2/nondegenerate_target.pcd
    source: tests/data/pcl_backend_v2/known_small_transform_source.pcd
    applied_target_to_source_translation_m: [0.01, -0.02, 0.03]
    applied_target_to_source_rotation_rpy_deg: [0.2, -0.3, 0.5]
    rotation_convention: Rz_yaw_Ry_pitch_Rx_roll
    expected_estimate: source_to_target_inverse_of_applied_transform
    initial_transform: identity
    truth_passed_to_registration_cli: false
    gates:
      translation_error_to_truth_m_max: 1.0e-4
      rotation_error_to_truth_rad_max: 1.0e-4
      has_converged_raw: true
      final_transform_finite: true
      fitness_finite: true
  PLANAR_DEGENERACY_DIAGNOSTIC:
    source: tests/data/pcl_backend/identity_source.pcd
    target: tests/data/pcl_backend/identity_target.pcd
    fixture_modification_forbidden: true
    gates:
      point_cloud_rank: 2
      point_to_plane_jacobian_rank_max_exclusive: 6
      rank_deficient: true
    has_converged_raw_required: false

cli_diagnostics:
  required_scalar_fields:
    - has_converged_raw
    - final_transform_finite
    - fitness_finite
    - finite_output
    - qualification_pass
    - iteration_count
    - correspondence_count
  source_and_target_normal_fields:
    - finite_count
    - zero_count
    - nan_count
    - norm_min
    - norm_median
    - norm_max
  failure_reason_vocabulary:
    - NONFINITE_TRANSFORM
    - NONFINITE_FITNESS
    - PCL_NOT_CONVERGED
    - NO_CORRESPONDENCES
    - INVALID_NORMALS
    - RANK_DEFICIENT_DIAGNOSTIC
    - EXCEPTION
  unified_v1_failure_reason_forbidden_in_v2_output: pcl_icp_did_not_converge_or_nonfinite

authorization:
  implementation_valid_expression: A_pass and B_pass and C_diagnostic_pass
  phase_a_authorization_expression: PCL_BACKEND_IMPLEMENTATION_VALID
  if_expression_true:
    PCL_BACKEND_IMPLEMENTATION_VALID: true
    PCL_BACKEND_PHASE_A_QUALIFICATION_AUTHORIZED: true
  otherwise:
    PCL_BACKEND_IMPLEMENTATION_VALID: false
    PCL_BACKEND_PHASE_A_QUALIFICATION_AUTHORIZED: false
  phase_a_execution_in_v2: false
  phase_b_execution_in_v2: false
  failed_test_parameter_rescue_forbidden: true
  failed_test_third_backend_substitution_forbidden: true
