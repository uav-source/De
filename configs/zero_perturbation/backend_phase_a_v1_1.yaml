    - --override-parameters
    - --change-thresholds
    - --exclude-scene
    - --skip-failure
    - --replace-seed
    - --backend-subset
    - --native
  formal_authority_lock_field: formal_execution_authorized
  old_v1_lock_must_be_rejected: true
  formal_execution_before_v1_1_lock_forbidden: true
  snapshot_build_once: true
  shared_canonical_input: true
  atomic_write:
    temporary_suffix: .tmp
    fsync_before_replace: true
    replace_operation: atomic_rename
  resume:
    overwrite_forbidden: true
    existing_result_requires_matching_protocol_and_implementation_sha: true
    corrupt_existing_result_action: stop
    corrupt_existing_result_classification: CORRUPT_EXISTING_RESULT
  final_classifications:
    - SCIENTIFIC_SOLVER_FAILURE
    - INFRASTRUCTURE_INTERRUPTION
    - LOCK_MISMATCH
    - CORRUPT_EXISTING_RESULT
    - BACKEND_EXCEPTION
    - NONFINITE_OUTPUT

