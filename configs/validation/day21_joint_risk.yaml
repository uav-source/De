source_validation: day18_day20
targets:
  - axis_drift_rate
  - weak_drift_alignment

base_metrics:
  - ODI_median
  - AIS_median
  - lambda_min_clamped_median
  - condition_number_median
  - weak_alignment_median
  - path_length

risk_features:
  - joint_risk_equal
  - joint_risk_spectral
  - joint_risk_information
  - joint_risk_odi_information
  - joint_risk_no_odi
  - joint_risk_motion_aware

normalization: rank_percentile
effect_size_threshold: 0.10
n_permutations: 200
seed: 21000

expected_sign:
  joint_risk_equal:
    axis_drift_rate: positive
    weak_drift_alignment: positive
  joint_risk_spectral:
    axis_drift_rate: positive
    weak_drift_alignment: positive
  joint_risk_information:
    axis_drift_rate: positive
    weak_drift_alignment: positive
  joint_risk_odi_information:
    axis_drift_rate: positive
    weak_drift_alignment: positive
  joint_risk_no_odi:
    axis_drift_rate: positive
    weak_drift_alignment: positive
  joint_risk_motion_aware:
    axis_drift_rate: positive
    weak_drift_alignment: positive

notes: "Day 21 builds joint risk features from ODI, AIS, lambda_min, condition number, weak alignment, and motion/path evidence. It does not implement weak-subspace update."
